<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consultations | U-Tracksis</title>

  <!-- Apply theme immediately -->
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      var d = t || (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
      if (d === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <!-- bootstrap css -->
  <link rel="stylesheet" href="../../css/bootstrap.min.css">

  <!-- local bootstrap icons -->
  <link rel="stylesheet" href="../../css/bootstrap-icons.css">

  <!-- custom css -->
  <link rel="stylesheet" href="../../css/student/dashboard.css">

  <!-- consultations specific css -->
  <link rel="stylesheet" href="../../css/student/consultations.css">
</head>
<body>

  <div class="dashboard-wrapper">

    <!-- sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="../../assets/images/logo.png" alt="U-Tracksis" class="sidebar-logo">
        <div>
          <h6 class="sidebar-title">U-Tracksis</h6>
          <p class="sidebar-subtitle">STUDENT</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-link" href="dashboard.html">
          <img src="../../assets/icons/grid-1x2-fill.svg" alt="" class="bi"> Dashboard
        </a>
        <a class="nav-link" href="group-profile.html">
          <img src="../../assets/icons/people-fill.svg" alt="" class="bi"> Group Profile
        </a>
        <a class="nav-link" href="milestones.html">
          <img src="../../assets/icons/flag-fill.svg" alt="" class="bi"> Milestones
        </a>
        <a class="nav-link" href="submissions.html">
          <img src="../../assets/icons/cloud-upload-fill.svg" alt="" class="bi"> Submissions
        </a>
        <a class="nav-link" href="feedback.html">
          <img src="../../assets/icons/chat-left-text-fill.svg" alt="" class="bi"> Feedbacks
        </a>
        <a class="nav-link active" href="consultations.html">
          <img src="../../assets/icons/chat-dots-fill.svg" alt="" class="bi"> Consultations
        </a>
        <a class="nav-link" href="announcements.html">
          <img src="../../assets/icons/megaphone-fill.svg" alt="" class="bi"> Announcements
        </a>
      </nav>

      <div class="sidebar-footer">
        <span>Theme</span>
        <button class="theme-toggle" id="themeToggle" type="button" title="Toggle theme">
          <img src="../../assets/icons/moon-stars-fill.svg" alt="" class="bi" id="themeIcon">
        </button>
      </div>
    </aside>

    <!-- mobile overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- main content -->
    <main class="main-content">

      <!-- top bar -->
      <div class="top-bar">
        <button class="mobile-menu-btn" id="menuBtn" type="button">
          <img src="../../assets/icons/list.svg" alt="" class="bi">
        </button>

        <div class="topbar-actions">
          <span class="topbar-user" id="topbar-user">User Name</span>
          <button class="btn-logout" type="button" onclick="logout()">
            <img src="../../assets/icons/box-arrow-left.svg" alt="" class="bi">
            <span>Logout</span>
          </button>
        </div>
      </div>

      <div class="page-header">
        <p class="page-eyebrow">SCHEDULE</p>
        <h1 class="page-title">Request a Consultation</h1>
        <p class="page-subtitle">Comments and revisions from your adviser and panel members.</p>
      </div>

      <!-- recipient field -->
      <div class="to-field">
        <label class="form-label-sm">To:</label>
        <div class="to-input">
          <img src="../../assets/icons/person-circle.svg" alt="" class="to-avatar bi">
          <input type="text" class="form-control" id="recipientInput" placeholder="Select adviser or panel member">
        </div>
      </div>

      <div class="row g-3 mb-3">

        <!-- schedule picker box -->
        <div class="col-lg-6">
          <div class="box h-100">
            <p class="box-label">Schedule</p>
            <div class="mb-3">
              <label class="form-label-sm">Date</label>
              <input type="date" id="scheduledDate" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label-sm">Time</label>
              <input type="time" id="scheduledTime" class="form-control">
            </div>
          </div>
        </div>

        <!-- request details box -->
        <div class="col-lg-6">
          <div class="box h-100">
            <p class="box-label">Request Details</p>
            <form id="consultationForm">
              <div class="mb-3">
                <label class="form-label-sm">Topic</label>
                <input type="text" class="form-control" id="topicInput" placeholder="Enter consultation topic">
              </div>
              <div class="mb-3">
                <label class="form-label-sm">Agenda</label>
                <textarea class="form-control agenda-textarea" id="agendaInput" rows="3" placeholder="List items to discuss..."></textarea>
              </div>
              <div class="d-flex justify-content-end">
                <button type="submit" class="btn-action-primary">Send Request</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- consultation history box -->
      <div class="box" id="historyBox">
        <p class="box-label">Consultation History</p>
      </div>

    </main>
  </div>

  <script src="../../js/bootstrap.bundle.min.js"></script>
  <script src="../../js/student/theme.js"></script>
  <script src="../../js/student/dashboard.js"></script>
  <script src="../../js/student/consultations.js"></script>
  <script>
    /* sidebar toggle */
    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menuBtn');
    const overlay = document.getElementById('sidebarOverlay');

    function toggleSidebar() {
      sidebar.classList.toggle('show');
      overlay.classList.toggle('show');
    }

    menuBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    /* close sidebar on link click for mobile */
    document.querySelectorAll('.sidebar-nav .nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth < 992) toggleSidebar();
      });
    });

  </script>
</body>
</html>
